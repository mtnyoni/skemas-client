name: Build and publish Docker image

on:
    push:
        branches:
            - master
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build image
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  tags: skemas:ci
                  outputs: type=docker,dest=/tmp/skemas-image.tar
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Store image for publishing
              uses: actions/upload-artifact@v7
              with:
                  name: skemas-image
                  path: /tmp/skemas-image.tar
                  compression-level: 0
                  retention-days: 7

    publish:
        name: Publish image
        needs: build
        runs-on: ubuntu-latest
        environment: production
        env:
            IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/skemas

        steps:
            - name: Download built image
              uses: actions/download-artifact@v7
              with:
                  name: skemas-image
                  path: /tmp

            - name: Load built image
              run: docker load --input /tmp/skemas-image.tar

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha

            - name: Tag and push image
              env:
                  IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
              run: |
                  while IFS= read -r tag; do
                      docker tag skemas:ci "$tag"
                      docker push "$tag"
                  done <<< "$IMAGE_TAGS"
